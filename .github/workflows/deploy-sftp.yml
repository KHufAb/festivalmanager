name: Deploy Festival Manager via SFTP

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: dev
        type: choice
        options:
          - dev
          - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy over SFTP
        env:
          SFTP_HOST: ${{ secrets.PROJECTCIRCUS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.PROJECTCIRCUS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.PROJECTCIRCUS_SFTP_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "live" ]; then
            REMOTE_DIR="/public_html/festivalmanager"
          else
            REMOTE_DIR="/public_html/dev/festivalmanager"
          fi

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$REMOTE_DIR"
          mirror --reverse --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .DS_Store \
            ./ "$REMOTE_DIR/"
          bye
          EOF
